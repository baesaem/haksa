<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="Pretendard, 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16225a"/>
      <stop offset="55%" stop-color="#22357f"/>
      <stop offset="100%" stop-color="#2f5bea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d99b"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2fb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#060c24" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 바탕 -->
  <rect width="1600" height="560" fill="url(#bg)"/>
  <g opacity="0.22" filter="url(#glow)">
    <circle cx="1310" cy="90" r="150" fill="#7aa2ff"/>
    <circle cx="170" cy="520" r="170" fill="#4f7bff"/>
  </g>
  <!-- 옅은 달력 격자 무늬 -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="1.4">
    <path d="M0 140H1600M0 280H1600M0 420H1600"/>
    <path d="M200 0V560M400 0V560M600 0V560M800 0V560M1000 0V560M1200 0V560M1400 0V560"/>
  </g>

  <!-- 왼쪽 글 -->
  <g transform="translate(96,118)">
    <g>
      <rect x="0" y="0" width="56" height="56" rx="16" fill="#ffffff" opacity="0.14"/>
      <g transform="translate(14,14)" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round">
        <rect x="1.5" y="3.5" width="25" height="23" rx="5"/>
        <path d="M1.5 11h25M9 1.5v5M19 1.5v5"/>
      </g>
      <text x="72" y="36" fill="#dfe7ff" font-size="24" font-weight="700" letter-spacing="0.5">리천 학사 일정 · 시수 편성 도우미</text>
    </g>

    <text x="0" y="132" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1">개학일만 넣으면</text>
    <text x="0" y="208" font-size="62" font-weight="800" letter-spacing="-1">
      <tspan fill="url(#gold)">한 해 학사일정</tspan><tspan fill="#ffffff">이 만들어집니다</tspan>
    </text>

    <text x="0" y="266" fill="#c8d5ff" font-size="25" font-weight="500">수업일수 · 방학 · 공휴일 자동 생성 · 창체(자유학기) 편성 · 시수배정과 학사일정 연동</text>

    <g transform="translate(0,300)" font-size="20" font-weight="700">
      <g>
        <rect x="0" y="0" width="208" height="46" rx="23" fill="#ffffff" opacity="0.14"/>
        <text x="104" y="30" fill="#ffffff" text-anchor="middle">초 · 중 · 고 모두</text>
      </g>
      <g transform="translate(224,0)">
        <rect x="0" y="0" width="226" height="46" rx="23" fill="#ffffff" opacity="0.14"/>
        <text x="113" y="30" fill="#ffffff" text-anchor="middle">어느 학년도든</text>
      </g>
      <g transform="translate(466,0)">
        <rect x="0" y="0" width="300" height="46" rx="23" fill="#ffffff" opacity="0.14"/>
        <text x="150" y="30" fill="#ffffff" text-anchor="middle">한글 · 워드 · 엑셀 출력</text>
      </g>
    </g>

    <text x="0" y="396" fill="#93a8e8" font-size="19" font-weight="600">haksa.richeon.kr · 설치 없이 브라우저에서 바로 체험</text>
  </g>

  <!-- 오른쪽 화면 모형: 시수배정표 -->
  <g transform="translate(980,86)" filter="url(#soft)">
    <rect width="536" height="388" rx="20" fill="url(#sheet)"/>
    <rect width="536" height="46" rx="20" fill="#e8edf9"/>
    <rect y="30" width="536" height="16" fill="#e8edf9"/>
    <g fill="#c2cce4">
      <circle cx="26" cy="23" r="6"/><circle cx="46" cy="23" r="6"/><circle cx="66" cy="23" r="6"/>
    </g>
    <text x="92" y="29" fill="#5b6885" font-size="15" font-weight="700">시수 배정 · 1학년 1학기</text>

    <!-- 배지 -->
    <g transform="translate(22,62)" font-size="13" font-weight="700">
      <rect width="112" height="26" rx="13" fill="#dbe4fd"/><text x="56" y="18" fill="#2f5bea" text-anchor="middle">수업일수 95일</text>
      <g transform="translate(122,0)"><rect width="124" height="26" rx="13" fill="#dbe4fd"/><text x="62" y="18" fill="#2f5bea" text-anchor="middle">수업시수 577시간</text></g>
      <g transform="translate(256,0)"><rect width="150" height="26" rx="13" fill="#d8f1e2"/><text x="75" y="18" fill="#0f7a47" text-anchor="middle">이수 33단위 / 계획 33</text></g>
    </g>

    <!-- 격자 -->
    <g transform="translate(22,104)">
      <g fill="#dfe5f2">
        <rect width="30" height="22" rx="4"/><rect x="36" width="44" height="22" rx="4"/><rect x="86" width="44" height="22" rx="4"/><rect x="136" width="44" height="22" rx="4"/><rect x="186" width="44" height="22" rx="4"/><rect x="236" width="44" height="22" rx="4"/><rect x="286" width="44" height="22" rx="4"/><rect x="336" width="44" height="22" rx="4"/><rect x="386" width="44" height="22" rx="4"/><rect x="436" width="56" height="22" rx="4"/>
      </g>
      <g transform="translate(0,28)">
        <g fill="#eef1f8">
          <rect width="30" height="26" rx="5" fill="#e3e8f4"/><rect x="36" width="44" height="26" rx="5"/><rect x="86" width="44" height="26" rx="5"/><rect x="136" width="44" height="26" rx="5"/><rect x="186" width="44" height="26" rx="5"/><rect x="236" width="44" height="26" rx="5"/><rect x="286" width="44" height="26" rx="5"/><rect x="336" width="44" height="26" rx="5"/><rect x="386" width="44" height="26" rx="5"/><rect x="436" width="56" height="26" rx="5"/>
        </g>
        <rect x="286" width="44" height="26" rx="5" fill="#cdeadb"/><text x="308" y="18" fill="#0f7a47" font-size="13" font-weight="700" text-anchor="middle">자율</text>
        <rect x="436" width="56" height="26" rx="5" fill="#f6e7c4"/><text x="464" y="18" fill="#8a6a1f" font-size="13" font-weight="700" text-anchor="middle">주제</text>
      </g>
      <g transform="translate(0,60)">
        <g fill="#eef1f8">
          <rect width="30" height="26" rx="5" fill="#e3e8f4"/><rect x="36" width="44" height="26" rx="5"/><rect x="86" width="44" height="26" rx="5"/><rect x="136" width="44" height="26" rx="5"/><rect x="186" width="44" height="26" rx="5"/><rect x="236" width="44" height="26" rx="5"/><rect x="286" width="44" height="26" rx="5"/><rect x="336" width="44" height="26" rx="5"/><rect x="386" width="44" height="26" rx="5"/><rect x="436" width="56" height="26" rx="5"/>
        </g>
        <rect x="136" width="44" height="26" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/><text x="158" y="18" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">금4</text>
        <rect x="186" width="44" height="26" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/><text x="208" y="18" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">금5</text>
        <rect x="386" width="44" height="26" rx="5" fill="#e4d7fb"/><text x="408" y="18" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="middle">평가</text>
      </g>
      <g transform="translate(0,92)">
        <g fill="#eef1f8">
          <rect width="30" height="26" rx="5" fill="#e3e8f4"/><rect x="36" width="44" height="26" rx="5"/><rect x="86" width="44" height="26" rx="5"/><rect x="136" width="44" height="26" rx="5"/><rect x="186" width="44" height="26" rx="5"/><rect x="236" width="44" height="26" rx="5"/><rect x="286" width="44" height="26" rx="5"/><rect x="336" width="44" height="26" rx="5"/><rect x="386" width="44" height="26" rx="5"/><rect x="436" width="56" height="26" rx="5"/>
        </g>
        <rect x="236" width="44" height="26" rx="5" fill="#ffffff" stroke="#2f5bea" stroke-width="2.2"/><text x="258" y="18" fill="#2f5bea" font-size="13" font-weight="700" text-anchor="middle">화6</text>
        <rect x="336" width="44" height="26" rx="5" fill="#cdeadb"/><text x="358" y="18" fill="#0f7a47" font-size="13" font-weight="700" text-anchor="middle">동아</text>
      </g>
      <g transform="translate(0,124)">
        <g fill="#eef1f8">
          <rect width="30" height="26" rx="5" fill="#e3e8f4"/><rect x="36" width="44" height="26" rx="5"/><rect x="86" width="44" height="26" rx="5"/><rect x="136" width="44" height="26" rx="5"/><rect x="186" width="44" height="26" rx="5"/><rect x="236" width="44" height="26" rx="5"/><rect x="286" width="44" height="26" rx="5"/><rect x="336" width="44" height="26" rx="5"/><rect x="386" width="44" height="26" rx="5"/><rect x="436" width="56" height="26" rx="5"/>
        </g>
        <rect x="436" width="56" height="26" rx="5" fill="#f6e7c4"/><text x="464" y="18" fill="#8a6a1f" font-size="13" font-weight="700" text-anchor="middle">진탐</text>
      </g>
      <!-- 합계 줄 -->
      <g transform="translate(0,160)" font-size="12" font-weight="700" fill="#5b6885">
        <rect width="492" height="24" rx="6" fill="#e8edf9"/>
        <text x="16" y="17">교시별</text><text x="120" y="17">19</text><text x="180" y="17">19</text><text x="240" y="17">18</text><text x="300" y="17">19</text><text x="360" y="17">17</text><text x="420" y="17">19</text>
      </g>
    </g>
  </g>

  <!-- 아래 리본 -->
  <g transform="translate(0,506)">
    <rect width="1600" height="54" fill="#0c1636" opacity="0.55"/>
    <text x="96" y="34" fill="#aebbe6" font-size="18" font-weight="600">연간 · 월간(탁상용) 달력 · 시수배정표 · 창체(자유학기) 계획표 · 수업일수/시수 운영 계획 · 시수 통계표</text>
    <text x="1504" y="34" fill="#8fa0d6" font-size="17" font-weight="600" text-anchor="end">제작 : 리천. 마음을 여는 창</text>
  </g>
</svg>
